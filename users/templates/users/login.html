<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voice Emotion Detection - Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #0c2461 0%, #1e3799 30%, #4a69bd 100%);
            font-family: 'Poppins', sans-serif;
            padding: 20px;
            position: relative;
            overflow: hidden;
        }

        /* Animated background elements */
        .bg-particles {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: 0;
        }

        .particle {
            position: absolute;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            animation: float 15s infinite linear;
        }

        .particle:nth-child(1) {
            width: 80px;
            height: 80px;
            top: 10%;
            left: 10%;
            animation-delay: 0s;
        }

        .particle:nth-child(2) {
            width: 120px;
            height: 120px;
            top: 70%;
            left: 80%;
            animation-delay: 2s;
        }

        .particle:nth-child(3) {
            width: 60px;
            height: 60px;
            top: 40%;
            left: 85%;
            animation-delay: 4s;
        }

        .particle:nth-child(4) {
            width: 100px;
            height: 100px;
            top: 80%;
            left: 15%;
            animation-delay: 6s;
        }

        .particle:nth-child(5) {
            width: 70px;
            height: 70px;
            top: 20%;
            left: 70%;
            animation-delay: 8s;
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0) rotate(0deg);
            }
            33% {
                transform: translateY(-30px) rotate(120deg);
            }
            66% {
                transform: translateY(20px) rotate(240deg);
            }
        }

        #FormContainer {
            border-radius: 20px;
            width: 100%;
            max-width: 420px;
            padding: 45px 40px;
            background: rgba(255, 255, 255, 0.95);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            z-index: 1;
            transition: transform 0.4s, box-shadow 0.4s;
            overflow: hidden;
        }

        #FormContainer:hover {
            transform: translateY(-10px);
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.4);
        }

        #FormContainer::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 5px;
            background: linear-gradient(90deg, #FF9A00, #FF5E00, #FF0080, #2575fc);
            z-index: 2;
        }

        .logo-container {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
            width: 100%;
        }

        .logo-icon {
            font-size: 2.5rem;
            margin-right: 15px;
            color: #2575fc;
            background: linear-gradient(135deg, #2575fc, #6a11cb);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        h1 {
            color: #1e3799;
            font-size: 2.2rem;
            font-weight: 700;
            text-align: center;
            margin-bottom: 5px;
            position: relative;
        }

        h1::after {
            content: '';
            position: absolute;
            bottom: -10px;
            left: 50%;
            transform: translateX(-50%);
            width: 80px;
            height: 4px;
            background: linear-gradient(90deg, #FF9A00, #FF5E00);
            border-radius: 2px;
        }

        .subtitle {
            color: #666;
            font-size: 0.95rem;
            margin: 20px 0 30px;
            text-align: center;
            font-weight: 400;
        }

        .form-group {
            width: 100%;
            margin-bottom: 25px;
            position: relative;
        }

        label {
            font-size: 0.9rem;
            font-weight: 600;
            color: #444;
            margin-bottom: 8px;
            display: block;
            transition: color 0.3s;
        }

        .input-wrapper {
            position: relative;
            width: 100%;
        }

        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 16px 16px 16px 50px;
            border-radius: 12px;
            border: 2px solid #e0e0e0;
            background-color: #f8f9fa;
            color: #333;
            font-size: 1rem;
            font-weight: 500;
            outline: none;
            transition: all 0.3s;
        }

        input[type="text"]:focus,
        input[type="password"]:focus {
            border-color: #2575fc;
            background-color: #fff;
            box-shadow: 0 5px 15px rgba(37, 117, 252, 0.2);
        }

        .input-icon {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: #777;
            font-size: 1.2rem;
            transition: color 0.3s;
        }

        input:focus + .input-icon {
            color: #2575fc;
        }

        button {
            width: 100%;
            padding: 18px 0;
            border-radius: 12px;
            background: linear-gradient(90deg, #2575fc, #6a11cb);
            color: #fff;
            border: none;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 10px;
            position: relative;
            overflow: hidden;
            letter-spacing: 0.5px;
        }

        button::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
            transition: left 0.7s;
        }

        button:hover {
            background: linear-gradient(90deg, #1e60d4, #5a0cb3);
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(37, 117, 252, 0.3);
        }

        button:hover::before {
            left: 100%;
        }

        .links {
            margin-top: 25px;
            text-align: center;
            width: 100%;
        }

        .links a {
            color: #2575fc;
            text-decoration: none;
            font-size: 0.95rem;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            transition: all 0.3s;
        }

        .links a:hover {
            color: #FF5E00;
            transform: translateX(5px);
        }

        .links a i {
            margin-right: 8px;
            font-size: 1rem;
        }

        .alert {
            width: 100%;
            padding: 15px;
            border-radius: 10px;
            background: linear-gradient(90deg, rgba(231, 76, 60, 0.1), rgba(231, 76, 60, 0.05));
            border-left: 4px solid #e74c3c;
            margin-bottom: 25px;
            color: #c0392b;
            font-size: 0.9rem;
            font-weight: 500;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .alert button {
            width: auto;
            background: transparent;
            color: #c0392b;
            font-size: 1.5rem;
            padding: 0;
            margin: 0;
            transition: color 0.3s;
        }

        .alert button:hover {
            background: transparent;
            color: #a93226;
            transform: none;
            box-shadow: none;
        }

        .emoji-container {
            display: flex;
            justify-content: center;
            margin-bottom: 25px;
            width: 100%;
        }

        .emoji {
            font-size: 2.8rem;
            margin: 0 8px;
            animation: bounce 2.5s infinite;
        }

        .emoji:nth-child(1) {
            animation-delay: 0s;
            color: #FF9A00;
        }

        .emoji:nth-child(2) {
            animation-delay: 0.2s;
            color: #FF5E00;
        }

        .emoji:nth-child(3) {
            animation-delay: 0.4s;
            color: #2575fc;
        }

        @keyframes bounce {
            0%, 100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-15px);
            }
        }

        .remember-forgot {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            margin-bottom: 25px;
            font-size: 0.9rem;
        }

        .remember-me {
            display: flex;
            align-items: center;
        }

        .remember-me input {
            margin-right: 8px;
            width: auto;
        }

        .forgot-password a {
            color: #2575fc;
            text-decoration: none;
            font-weight: 600;
            transition: color 0.3s;
        }

        .forgot-password a:hover {
            color: #FF5E00;
        }

        @media (max-width: 768px) {
            #FormContainer {
                max-width: 90%;
                padding: 35px 30px;
            }
            
            h1 {
                font-size: 1.9rem;
            }
            
            .emoji {
                font-size: 2.2rem;
            }
        }

        @media (max-width: 480px) {
            #FormContainer {
                max-width: 100%;
                border-radius: 15px;
                padding: 30px 25px;
            }
            
            h1 {
                font-size: 1.7rem;
            }
            
            .emoji {
                font-size: 2rem;
            }
            
            .remember-forgot {
                flex-direction: column;
                align-items: flex-start;
            }
            
            .forgot-password {
                margin-top: 10px;
            }
        }
    </style>
</head>
<body>
    <!-- Animated background particles -->
    <div class="bg-particles">
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
    </div>
    
    <div id="FormContainer">
        <!-- Logo and title -->
        <div class="logo-container">
            <i class="fas fa-brain logo-icon"></i>
            <h1>Emotion Detection</h1>
        </div>
        
        <!-- Animated emojis -->
        <div class="emoji-container">
            <div class="emoji">🎤</div>
            <div class="emoji">📹</div>
            <div class="emoji">💬</div>
        </div>
        
        <p class="subtitle">Sign in to analyze emotions from voice, camera & text</p>
        
        <form method="POST">
            {% csrf_token %}
            
            <!-- Error messages -->
            {% if form.errors %}
                <div class="alert">
                    <div id="form_errors">
                        {% for key, value in form.errors.items %}
                            <strong>{{ value }}</strong>
                        {% endfor %}
                    </div>
                    <button type="button" class="close" onclick="this.parentElement.style.display='none'">
                        <i class="fas fa-times"></i>
                    </button>
                </div>
            {% endif %}
            
            <!-- Username field -->
            <div class="form-group">
                <label for="username">Username</label>
                <div class="input-wrapper">
                    <i class="fas fa-user input-icon"></i>
                    {{ form.username }}
                </div>
            </div>
            
            <!-- Password field -->
            <div class="form-group">
                <label for="password">Password</label>
                <div class="input-wrapper">
                    <i class="fas fa-lock input-icon"></i>
                    {{ form.password }}
                </div>
            </div>
            
            <!-- Remember me & forgot password -->
            <div class="remember-forgot">
                <div class="remember-me">
                    <input type="checkbox" id="remember" name="remember">
                    <label for="remember" style="margin-bottom: 0; font-weight: 500;">Remember me</label>
                </div>
                <div class="forgot-password">
                    <a href="#">Forgot password?</a>
                </div>
            </div>
            
            <!-- Login button -->
            <button type="submit">
                <i class="fas fa-sign-in-alt" style="margin-right: 10px;"></i> Sign In
            </button>
            
            <!-- Registration link -->
            <div class="links">
                <a href="{% url 'users-register' %}">
                    <i class="fas fa-user-plus"></i> Create an Account
                </a>
            </div>
        </form>
    </div>

    <script>
        // Add placeholder text to form inputs if they don't have any
        document.addEventListener('DOMContentLoaded', function() {
            const usernameInput = document.querySelector('input[type="text"]');
            const passwordInput = document.querySelector('input[type="password"]');
            
            if (usernameInput && !usernameInput.getAttribute('placeholder')) {
                usernameInput.setAttribute('placeholder', 'Enter your username');
            }
            
            if (passwordInput && !passwordInput.getAttribute('placeholder')) {
                passwordInput.setAttribute('placeholder', 'Enter your password');
            }
            
            // Add focus effects to form inputs
            const formInputs = document.querySelectorAll('input[type="text"], input[type="password"]');
            formInputs.forEach(input => {
                input.addEventListener('focus', function() {
                    this.parentElement.parentElement.querySelector('label').style.color = '#2575fc';
                });
                
                input.addEventListener('blur', function() {
                    this.parentElement.parentElement.querySelector('label').style.color = '#444';
                });
            });
            
            // Form submission animation
            const form = document.querySelector('form');
            if (form) {
                form.addEventListener('submit', function(e) {
                    const button = this.querySelector('button[type="submit"]');
                    button.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Signing In...';
                    button.disabled = true;
                });
            }
        });
    </script>
</body>
</html>
